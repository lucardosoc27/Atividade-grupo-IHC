<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Envio confirmado — SENAI CIMATEC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="app-navbar">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <span class="brand">Atividades <small>SENAI CIMATEC</small></span>
      <div class="d-flex align-items-center gap-3">
        <span id="nome-usuario" class="text-muted" style="font-size: 0.9rem"></span>
        <button id="btn-sair" class="btn btn-outline-primary btn-sm">
          <i class="fa-solid fa-arrow-right-from-bracket me-1" aria-hidden="true"></i>Sair
        </button>
      </div>
    </div>
  </header>

  <main id="conteudo" class="container py-5 text-center" style="max-width: 520px">
    <div class="confirmation-mark mx-auto mb-3">
      <i class="fa-solid fa-check" aria-hidden="true"></i>
    </div>
    <h1 class="h3 mb-2" id="titulo-confirmacao">Entrega registrada</h1>
    <p class="text-muted mb-4" id="resumo-envio"></p>

    <dl class="receipt p-4 mb-4 d-none" id="recibo">
      <dt>Atividade</dt>
      <dd id="recibo-atividade"></dd>
      <dt>Arquivo</dt>
      <dd id="recibo-arquivo"></dd>
      <dt>Enviado em</dt>
      <dd id="recibo-data"></dd>
      <dt>Status</dt>
      <dd id="recibo-status" class="mb-0"></dd>
    </dl>

    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
      <a href="atividades.html" class="btn btn-primary">
        <i class="fa-solid fa-list me-2" aria-hidden="true"></i>Ver minhas atividades
      </a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/util.js" defer></script>
  <script src="assets/js/storage.js" defer></script>
  <script src="assets/js/confirmacao.js" defer></script>
</body>
</html>
